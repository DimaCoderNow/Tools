<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/style.css">

    <title>Title</title>
</head>
<body>
<div class="contents">
    <div class="top">
        <div class="sub_menu">
            <label for="organization">Организация</label>
            <select id="organization" name="organization" required>
                <option value="">-- Выберите организацию --</option>
                <option value="lysenko">ИП Лысенко</option>
                <option value="stroytechagro">Стройтехагро</option>
                <option value="robix">Робикс</option>
            </select>
        </div>
        <div class="sub_menu">
            <label for="number">Номер договора</label>
            <input type="text" id="number" name="number" required>
        </div>
        <div class="sub_menu">
            <label for="date">Дата договора</label>
            <input type="date" id="date" name="date" required>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="left">
            <div class="button-full" data-target="buyer">Покупатель</div>
            <div class="button-full" data-target="product">Товар</div>
            <div class="button-full" data-target="download">Скачать</div>
        </div>
        <div class="right">
            <div class="buyer">
                <form action="/submit" method="post" class="form">
                    <label for="fio">ФИО</label>
                    <input type="text" id="fio" name="fio" required>

                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" required>

                    <label for="birth_date">Дата рождения</label>
                    <input type="date" id="birth_date" name="birth_date" required>

                    <label for="passport_series">Серия паспорта</label>
                    <input type="text" id="passport_series" name="passport_series" maxlength="4" required>

                    <label for="passport_number">Номер паспорта</label>
                    <input type="text" id="passport_number" name="passport_number" maxlength="6" required>

                    <label for="passport_code">Код подразделения</label>
                    <input type="text" id="passport_code" name="passport_code" maxlength="7" required>

                    <label for="passport_date">Дата выдачи</label>
                    <input type="date" id="passport_date" name="passport_date" required>

                    <label for="passport_issued">Кем выдан</label>
                    <textarea rows="5" cols="33" id="passport_issued" name="passport_issued"></textarea>

                    <label for="address">Адрес</label>
                    <textarea rows="5" cols="33" id="address" name="address"></textarea>
                </form>
            </div>
            <div class="product">
                <div class="product-header">
                    <h2>📦 Товары</h2>
                    <button type="button" class="add-row-btn" onclick="addProductRow()">
                        + Добавить товар
                    </button>
                </div>

                <table class="products-table" id="products-table">
                    <thead>
                        <tr>
                            <th>Наименование товара</th>
                            <th>Количество</th>
                            <th>Сумма (₽)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>

                <div class="total-row">
                    <div class="total-inputs">
                        <div class="total-item">
                            <label for="contract-nds">
                                Сумма НДС (₽)
                            </label>
                            <input
                                    type="number"
                                    id="contract-nds"
                                    min="0"
                                    step="0.01"
                                    placeholder="Введите сумму НДС">
                        </div>
                        <div class="total-item">
                            <label for="contract-total">
                                Общая сумма договора (₽)
                            </label>
                            <input
                                    type="number"
                                    id="contract-total"
                                    min="0"
                                    step="0.01"
                                    placeholder="Введите общую сумму договора">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="static/script.js"></script>
</body>
</html>
