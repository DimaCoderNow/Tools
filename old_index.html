<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tools</title>
</head>
<style>
  .form {
    max-width: 400px;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-family: Arial, sans-serif;
  }

  .form input,
  .form textarea,
  .form button {
    padding: 10px;
    font-size: 14px;
  }

  .form button {
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
  }

  .form button:hover {
    background: #0056b3;
  }
</style>
<body>
  <h1>Hello</h1>
<form action="/submit" method="post" class="form">
  <h2>Анкета</h2>

  <label for="number">Номер договора</label>
  <input type="text" id="number" name="number" required>

  <label for="fio">ФИО</label>
  <input type="text" id="fio" name="fio" required>

  <label for="phone">Телефон</label>
  <input type="tel" id="phone" name="phone" required>

  <label for="passport_series">Серия паспорта</label>
  <input type="text" id="passport_series" name="passport_series" maxlength="4" required>

  <label for="passport_number">Номер паспорта</label>
  <input type="text" id="passport_number" name="passport_number" maxlength="6" required>

  <label for="address">Адрес</label>
  <textarea rows="5" cols="33" id="address" name="address"></textarea> amount_words

  <label for="product">Товар</label>
  <input type="text" id="product" name="product" maxlength="4" required>

  <label for="amount">Сумма</label>
  <input type="text" id="amount" name="amount" maxlength="4" required>

  <button type="submit">Отправить</button>
</form>


</body>
</html>
